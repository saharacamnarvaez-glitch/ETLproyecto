services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../medallon:/app/medallon
      - ../data:/app/data
      - ../api:/app/api
    env_file:
      - .env

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ../medallon:/app/medallon
      - ../data:/app/data
      - ../streamlit_app:/app/streamlit_app
    env_file:
      - .env
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0